name: Payment guard security tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install original checker cryptography test dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Compile all modules
        run: python -m compileall -q Payment_guard.py durable_store.py payment_boundary.py demo.py tests
      - name: Run adversarial and regression tests
        run: python -m unittest discover -s tests -v
      - name: Run offline developer demonstration
        run: python demo.py
